# Polaris lab
#
# Three site-exit routers (one ISP each), ten end hosts, the RA controller,
# and a web server that plays the Internet. Use the ./lab command in this
# directory instead of calling docker compose directly:
#
#   ./lab up       build and start, wait until ready
#   ./lab demo     apply policies and verify them end to end
#   ./lab down     stop and remove everything
#
#   internal  fc00:cafe:dead:beef::/64   hosts <-> routers (RAs)
#   upstream  fd10::/64                  routers <-> web server
#   mgmt      fd00::/64                  controller <-> routers (gRPC)
#
# Router   internal address              policy RA source   ISP prefix (NPTv6)
# (a)      fc00:cafe:dead:beef::ff01     fe80::face:1       2001:db8:a::/64
# (b)      fc00:cafe:dead:beef::ff02     fe80::face:2       2001:db8:b::/64
# (c)      fc00:cafe:dead:beef::ff03     fe80::face:3       2001:db8:c::/64

name: polaris-lab

x-router: &router
  build:
    context: ..
    dockerfile: laboratory/Dockerfile.agent
    additional_contexts:
      # go-ra source. Defaults to the submodule; set GO_RA_DIR to build from
      # another checkout (path relative to this file, or absolute).
      gora: ${GO_RA_DIR:-../agent/go-ra}
  cap_add: [NET_ADMIN, NET_RAW]
  sysctls:
    net.ipv6.conf.all.forwarding: 1
  restart: "no"

x-host: &host
  build:
    context: ..
    dockerfile: laboratory/Dockerfile.host
  cap_add: [NET_ADMIN]
  # The sysctl that makes Linux accept Route Information Options is added by
  # docker-compose.kernel-rio.yaml, because it does not exist on every kernel.
  networks: [internal]
  stop_grace_period: 1s

services:

  # ── The Internet ───────────────────────────────────────────────────────────
  web-server:
    build: { context: .., dockerfile: laboratory/Dockerfile.webserver }
    hostname: web-server
    cap_add: [NET_ADMIN]
    networks:
      upstream: { ipv6_address: "fd10::64" }
    stop_grace_period: 1s

  # ── Site-exit routers ──────────────────────────────────────────────────────
  router1:
    <<: *router
    hostname: router1
    environment: { ROUTER_LABEL: "Router(a)", ISP_PREFIX: "2001:db8:a::/64", POLICY_LL: "fe80::face:1" }
    networks:
      internal: { ipv6_address: "fc00:cafe:dead:beef::ff01" }
      mgmt:     { ipv6_address: "fd00::ff01" }
      upstream: { ipv6_address: "fd10::ff01" }

  router2:
    <<: *router
    hostname: router2
    environment: { ROUTER_LABEL: "Router(b)", ISP_PREFIX: "2001:db8:b::/64", POLICY_LL: "fe80::face:2" }
    networks:
      internal: { ipv6_address: "fc00:cafe:dead:beef::ff02" }
      mgmt:     { ipv6_address: "fd00::ff02" }
      upstream: { ipv6_address: "fd10::ff02" }

  router3:
    <<: *router
    hostname: router3
    environment: { ROUTER_LABEL: "Router(c)", ISP_PREFIX: "2001:db8:c::/64", POLICY_LL: "fe80::face:3" }
    networks:
      internal: { ipv6_address: "fc00:cafe:dead:beef::ff03" }
      mgmt:     { ipv6_address: "fd00::ff03" }
      upstream: { ipv6_address: "fd10::ff03" }

  # ── RA controller ──────────────────────────────────────────────────────────
  controller-backend:
    build: { context: .., dockerfile: laboratory/Dockerfile.backend }
    environment:
      PORT: "8080"
      DB_PATH: /data/controller.db
      NEIGHBOR_API_URLS: "http://neighbor-collector:8083/api/neighbors"
      NEIGHBOR_SOURCE_NAMES: "internal-segment"
      FETCH_INTERVAL: "10"
    # The database lives on tmpfs: `./lab down` always returns to a clean lab.
    tmpfs: [/data]
    networks: [mgmt, internal]   # internal: gRPC reaches the routers at their site address
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/api/routers"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  controller-frontend:
    build: { context: .., dockerfile: laboratory/Dockerfile.frontend }
    ports: ["${LAB_PORT:-3000}:80"]
    networks: [mgmt]
    depends_on:
      controller-backend: { condition: service_healthy }
    restart: unless-stopped

  # Polls the routers' NDP caches over SNMP to discover the hosts.
  neighbor-collector:
    build: { context: .., dockerfile: laboratory/Dockerfile.neighbor-collector }
    environment:
      ADDR: ":8083"
      POLL_INTERVAL: "10"
      # The lab routers tell the collector which interface faces the hosts.
      ALLOW_TARGET_REGISTRATION: "1"
      SNMP_TARGETS: >-
        [{"host":"router1","port":161,"community":"public"},
         {"host":"router2","port":161,"community":"public"},
         {"host":"router3","port":161,"community":"public"}]
    networks: [mgmt]
    restart: unless-stopped

  # ── End hosts ──────────────────────────────────────────────────────────────
  host01: { <<: *host, hostname: host01 }
  host02: { <<: *host, hostname: host02 }
  host03: { <<: *host, hostname: host03 }
  host04: { <<: *host, hostname: host04 }
  host05: { <<: *host, hostname: host05 }
  host06: { <<: *host, hostname: host06 }
  host07: { <<: *host, hostname: host07 }
  host08: { <<: *host, hostname: host08 }
  host09: { <<: *host, hostname: host09 }
  host10: { <<: *host, hostname: host10 }

networks:
  internal:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
        - subnet: fc00:cafe:dead:beef::/64
  mgmt:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.2.0/24
        - subnet: fd00::/64
  upstream:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.1.0/24
        - subnet: fd10::/64
