# Answers every request with the ISP the connection came through, derived
# from the NPTv6-translated client address.
geo $isp {
    default          unknown;
    2001:db8:a::/64  ISP-A;
    2001:db8:b::/64  ISP-B;
    2001:db8:c::/64  ISP-C;
}

server {
    listen [::]:80;
    listen 80;
    default_type text/plain;

    location / {
        return 200 "isp=$isp client=$remote_addr server=$server_addr\n";
    }
}
